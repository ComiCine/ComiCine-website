[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q

# Coverage is a gate, not just a report. `--cov-config=pytest.ini` makes coverage.py read these
# sections; CI and ops/ci_check.sh both pass it, so there is one copy of the thresholds.
[coverage:run]
# src/config.py is hand-written but mostly constants mirrored from config-contract.json and is
# already checked by ops/check_config_contract.py; counting it would dilute branch coverage
# without testing any behavior. Keep it out of the measured set, like the generated TS artifacts.
omit = src/config.py

[coverage:report]
# A floor, not a target: raise it when the quarterly review, or a measured value more than 10
# points above it, allows (+5 points per step). Lowering it requires a recorded reason in the
# task book and the delivery notes.
fail_under = 70
