# Daily limooo_blocklist sync (replaces the Cloudflare IP List sync portion of auto_block.py).
name = "limooo-blocklist-sync"
main = "src/index.ts"
compatibility_date = "2026-08-15"
account_id = "4a7fd8c8f1a59a265981a73e631b9e3f"

[triggers]
crons = ["30 3 * * *"]

# Shares the D1 database with the Pages project.
[[d1_databases]]
binding = "DB"
database_name = "limooo"
database_id = "e2f29d54-29c0-46af-938d-e13995a11d7f"

# Set these secrets before deployment:
#   wrangler secret put CLOUDFLARE_API_TOKEN
#   wrangler secret put CLOUDFLARE_ACCOUNT_ID
