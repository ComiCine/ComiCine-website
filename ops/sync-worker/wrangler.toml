# Daily comicine_blocklist sync (replaces the Cloudflare IP List sync portion of auto_block.py).
name = "comicine-blocklist-sync"
main = "src/index.ts"
compatibility_date = "2026-08-15"
account_id = "4a7fd8c8f1a59a265981a73e631b9e3f"

[triggers]
crons = ["30 3 * * *"]

# Shares the D1 database with the Pages project.
[[d1_databases]]
binding = "DB"
database_name = "comicine"
database_id = "b7165de7-aa78-45a3-869e-78f4d9cec12d"

# Set these secrets before deployment:
#   wrangler secret put CLOUDFLARE_API_TOKEN
#   wrangler secret put CLOUDFLARE_ACCOUNT_ID
