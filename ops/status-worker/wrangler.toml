# ComiCine status probes (docs/17, stage 2)
# Replaces Uptime Kuma:
#   - Cron Trigger runs HTTP/D1 probes every minute and writes to D1.
#   - Durable Object alarms recheck every 10 seconds after a down result and record recovery.
#   - GET /api/status provides data to the status page; GET /_health serves external and self-checks.
# Deploy with: bash ops/workers_deploy.sh --worker=comicine-status
name = "comicine-status"
main = "src/index.ts"
compatibility_date = "2026-08-15"
account_id = "4a7fd8c8f1a59a265981a73e631b9e3f"

[triggers]
crons = ["* * * * *", "47 3 * * *"]

# Shares the D1 database with the Pages project.
[[d1_databases]]
binding = "DB"
database_name = "comicine"
database_id = "b7165de7-aa78-45a3-869e-78f4d9cec12d"

[[durable_objects.bindings]]
name = "PROBE_STATE"
class_name = "ComiCineProbeState"

# SQLite backend: the Workers Free plan supports only SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ProbeState"]

[[migrations]]
tag = "v2"

  [[migrations.renamed_classes]]
  from = "ProbeState"
  to = "ComiCineProbeState"

[vars]
# Recheck interval after a down result, in seconds; matches the 10-second Kuma interval.
RETRY_INTERVAL_S = "10"
# Recheck window, in seconds; after it ends, the one-minute Cron interval resumes.
RETRY_WINDOW_S = "280"
# Consecutive failures required to report down; prevents alerts from a single transient failure.
FAIL_THRESHOLD = "2"
# Alert email (stage 3): sender, language, and down-alert cooldown in seconds.
ALERT_FROM = "no-reply@comicine.com"
ALERT_LANG = "zh-cn"
ALERT_COOLDOWN_S = "1800"
# Recipients are never stored in D1. Set `ALERT_TO` with `wrangler secret put` or a Dashboard
# environment variable; if unset, alerts are logged but not emailed.

# Email Service binding (requires Workers Paid and Email Sending onboarding).
# Uncomment to enable; without the binding, the code falls back to logging only.
# [[send_email]]
# name = "EMAIL"
