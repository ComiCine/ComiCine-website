# Archive the previous day's analytics details to R2 daily at 00:00 UTC.
name = "comicine-d1-archive"
main = "src/index.ts"
compatibility_date = "2026-08-15"
account_id = "4a7fd8c8f1a59a265981a73e631b9e3f"

[triggers]
crons = ["0 0 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "limooo"
database_id = "e2f29d54-29c0-46af-938d-e13995a11d7f"

[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "comicine-analytics"
