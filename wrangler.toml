# Limooo Cloudflare Pages configuration (the Pages project root is this site's directory).
name = "limooo"
compatibility_date = "2026-08-15"
pages_build_output_dir = "public"

# Configure these three keys as encrypted secrets in Pages project settings:
#   TURNSTILE_SITEKEY / TURNSTILE_SECRET / GATE_HMAC_KEY
# For local development, copy .dev.vars.example to .dev.vars and fill in the real values.
# .dev.vars is listed in .gitignore.

# D1 database binding configured in Pages project settings (binding = DB; see database_id below).
# Used for local development with wrangler pages dev:
[[d1_databases]]
binding = "DB"
database_name = "limooo"
database_id = "e2f29d54-29c0-46af-938d-e13995a11d7f"
