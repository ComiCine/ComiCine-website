[tool.mypy]
python_version = "3.11"
files = ["src"]
# Modules under src/ use flat imports (`from config import ...` / `import portfolio`)
# without a package prefix. Without this mypy search path, it reports nine imports
# between src/ modules as import-not-found (a configuration issue, not a code issue).
mypy_path = "src:typings"
# Setting mypy_path alone is not enough: src/ has no __init__.py, so mypy would
# load the same file under both module names "src.cidr" and "cidr" (Source file
# found twice). With explicit_package_bases enabled, src/ is a search root rather
# than a package, so both imports resolve as "cidr".
explicit_package_bases = true
namespace_packages = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"ops/*" = ["E402"]
